<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bibelcharaktere</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --bg-deep:#161c33;
  --bg-deeper:#10142a;
  --bg-card-dark:#1e2646;
  --parchment:#f4ead0;
  --parchment-2:#ecdfb8;
  --ink:#2b2113;
  --ink-soft:#5c4d34;
  --gold:#c9a24b;
  --gold-bright:#dbb964;
  --teal:#4f8f83;
  --teal-bright:#63ab9d;
  --text-light:#ede4cf;
  --text-muted:#9b93a8;
  --line:#2f3a5e;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg-deeper);
  color:var(--text-light);
  font-family:'Lora',Georgia,serif;
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:'Cinzel',serif;letter-spacing:.03em;}
button{font-family:inherit;}
input,textarea{font-family:'Lora',Georgia,serif;}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(ellipse at top, #202a52 0%, var(--bg-deeper) 60%);
}

/* HEADER */
header.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px 12px;
  background:linear-gradient(180deg, var(--bg-deeper) 70%, transparent);
}
.brand{display:flex;align-items:center;gap:9px;}
.brand-mark{
  width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-bright); font-family:'Cinzel',serif; font-size:14px; font-weight:600;
}
.brand-title{font-size:15px; font-weight:600; color:var(--text-light); text-transform:uppercase;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(201,162,75,0.12);
  border:1px solid rgba(201,162,75,0.35);
  color:var(--gold-bright);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.icon-btn svg{width:17px;height:17px;}

/* MAIN SCROLL AREA */
main{flex:1; padding:4px 18px 100px; overflow-x:hidden;}
.view{display:none;}
.view.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* VERSE BANNER */
.verse-banner{
  position:relative;
  background:var(--parchment);
  color:var(--ink);
  border-radius:16px;
  padding:22px 20px 20px;
  margin:10px 0 22px;
  border:1px solid var(--gold);
  box-shadow:0 10px 26px rgba(0,0,0,0.28);
}
.verse-banner::before{
  content:"";
  position:absolute; top:8px; left:8px; right:8px; bottom:8px;
  border:1px solid rgba(201,162,75,0.55);
  border-radius:10px;
  pointer-events:none;
}
.verse-eyebrow{
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:.14em;
  color:var(--gold-soft, #8a6c26); text-transform:uppercase; font-weight:600;
  margin:0 0 10px;
}
.verse-text{
  font-size:17px; line-height:1.55; font-style:italic; margin:0 0 10px;
}
.verse-ref{
  font-family:'Cinzel',serif; font-size:12.5px; font-weight:600; color:var(--ink-soft);
}

/* SECTION HEADS */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin:0 0 12px;
}
.section-head h2{font-size:16px; margin:0; color:var(--text-light);}
.section-head .link{font-size:12px; color:var(--teal-bright); cursor:pointer; font-family:'Lora',serif;}

/* SEARCH */
.search-wrap{position:relative; margin:8px 0 14px;}
.search-wrap svg{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; color:var(--text-muted);
}
.search-wrap input{
  width:100%;
  background:var(--bg-card-dark);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px 12px 38px;
  color:var(--text-light);
  font-size:14.5px;
  outline:none;
}
.search-wrap input::placeholder{color:var(--text-muted);}
.search-wrap input:focus{border-color:var(--teal);}

/* CHIPS */
.chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 0 16px; scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;
  padding:7px 14px;
  border-radius:999px;
  font-size:12.5px;
  border:1px solid var(--line);
  color:var(--text-muted);
  background:var(--bg-card-dark);
  cursor:pointer;
  white-space:nowrap;
}
.chip.active{
  background:rgba(79,143,131,0.22);
  border-color:var(--teal);
  color:var(--teal-bright);
}

/* CHARACTER CARD (list) */
.char-list{display:flex; flex-direction:column; gap:10px;}
.char-card{
  display:flex; align-items:center; gap:13px;
  background:var(--bg-card-dark);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  cursor:pointer;
}
.char-card:active{background:#242c52;}
.char-initial{
  flex:0 0 44px; width:44px; height:44px; border-radius:10px;
  border:1px solid var(--gold);
  background:linear-gradient(160deg, rgba(201,162,75,0.18), rgba(201,162,75,0.04));
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-size:18px; font-weight:600; color:var(--gold-bright);
}
.char-info{flex:1; min-width:0;}
.char-name{font-size:15px; font-weight:600; color:var(--text-light); font-family:'Lora',serif; margin:0 0 3px;}
.char-meta{font-size:11px; color:var(--teal-bright); font-family:'Cinzel',serif; letter-spacing:.04em; margin:0 0 4px;}
.char-teaser{font-size:12.5px; color:var(--text-muted); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bm-star{flex:0 0 auto; color:var(--gold-bright); opacity:0; width:16px; height:16px;}
.bm-star.on{opacity:1;}

.empty-note{
  text-align:center; color:var(--text-muted); font-size:13.5px; padding:40px 20px; line-height:1.6;
}

/* FEATURED HOME CARDS */
.featured-scroll{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none;}
.featured-scroll::-webkit-scrollbar{display:none;}
.featured-card{
  flex:0 0 132px;
  background:var(--bg-card-dark);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 12px;
  cursor:pointer;
  text-align:center;
}
.featured-card .char-initial{margin:0 auto 10px; flex:none; width:46px; height:46px;}
.featured-card .char-name{font-size:13.5px; margin-bottom:2px;}
.featured-card .char-meta{font-size:10px;}

/* DETAIL VIEW */
#detail-view{
  position:fixed; inset:0; z-index:50;
  background:var(--bg-deeper);
  max-width:480px; margin:0 auto;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  overflow-y:auto;
}
#detail-view.open{transform:translateY(0);}
.detail-header{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 16px 10px;
  background:linear-gradient(180deg, var(--bg-deeper) 75%, transparent);
}
.detail-body{padding:0 22px 60px;}
.illum-frame{
  width:74px; height:74px; margin:6px auto 18px;
  border:2px solid var(--gold);
  border-radius:10px;
  position:relative;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 30% 25%, rgba(201,162,75,0.28), rgba(201,162,75,0.04));
}
.illum-frame::before,.illum-frame::after{
  content:""; position:absolute; width:10px; height:10px; border:1px solid var(--gold);
}
.illum-frame::before{top:-5px; left:-5px; border-right:none; border-bottom:none;}
.illum-frame::after{bottom:-5px; right:-5px; border-left:none; border-top:none;}
.illum-letter{font-family:'Cinzel',serif; font-size:34px; font-weight:700; color:var(--gold-bright);}
.detail-name{font-size:25px; text-align:center; margin:0 0 8px; color:var(--text-light);}
.detail-badges{display:flex; justify-content:center; gap:8px; margin:0 0 24px; flex-wrap:wrap;}
.badge{
  font-family:'Cinzel',serif; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
  padding:5px 11px; border-radius:999px; border:1px solid var(--line); color:var(--text-muted);
}
.badge.testament{border-color:var(--teal); color:var(--teal-bright);}

.detail-h3{
  font-family:'Cinzel',serif; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--gold-bright); margin:26px 0 10px;
  display:flex; align-items:center; gap:10px;
}
.detail-h3::after{content:""; flex:1; height:1px; background:var(--line);}
.story-text{font-size:15.5px; line-height:1.75; color:var(--text-light); margin:0;}

.lesson-box{
  background:rgba(79,143,131,0.10);
  border-left:3px solid var(--teal);
  border-radius:0 10px 10px 0;
  padding:14px 16px;
  font-size:14.5px; line-height:1.65; color:var(--text-light);
}
.verse-line{
  font-size:14px; color:var(--text-muted); font-family:'Cinzel',serif; letter-spacing:.03em;
}

.notes-area{
  width:100%; min-height:100px; resize:vertical;
  background:var(--bg-card-dark); border:1px solid var(--line); border-radius:10px;
  color:var(--text-light); padding:12px 14px; font-size:14px; line-height:1.6; outline:none;
}
.notes-area:focus{border-color:var(--teal);}
.save-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
.save-btn{
  background:rgba(79,143,131,0.18); border:1px solid var(--teal); color:var(--teal-bright);
  padding:9px 18px; border-radius:9px; font-size:13px; cursor:pointer; font-family:'Cinzel',serif; letter-spacing:.04em;
}
.save-hint{font-size:11.5px; color:var(--text-muted);}

.bookmark-toggle{
  display:flex; align-items:center; gap:7px;
  background:rgba(201,162,75,0.10); border:1px solid var(--gold);
  padding:8px 14px; border-radius:9px; cursor:pointer;
  font-size:12.5px; color:var(--gold-bright); font-family:'Cinzel',serif; letter-spacing:.03em;
}
.bookmark-toggle svg{width:15px; height:15px;}
.bookmark-toggle.active{background:rgba(201,162,75,0.28);}

/* MERKLISTE */
.merk-card{
  background:var(--bg-card-dark); border:1px solid var(--line); border-radius:12px;
  padding:14px 15px; margin-bottom:12px; cursor:pointer;
}
.merk-top{display:flex; align-items:center; gap:12px; margin-bottom:8px;}
.merk-note-preview{
  font-size:12.5px; color:var(--text-muted); line-height:1.5; margin:8px 0 0;
  border-top:1px solid var(--line); padding-top:8px;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}

/* BOTTOM NAV */
nav.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  max-width:480px; margin:0 auto;
  background:rgba(16,20,42,0.94);
  backdrop-filter:blur(6px);
  border-top:1px solid var(--line);
  display:flex;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--text-muted); cursor:pointer; padding:6px 0;
}
.tab-btn svg{width:21px; height:21px;}
.tab-btn span{font-size:10.5px; font-family:'Cinzel',serif; letter-spacing:.04em;}
.tab-btn.active{color:var(--gold-bright);}

.intro-text{font-size:14px; color:var(--text-muted); line-height:1.6; margin:0 0 22px;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div class="brand-title">Bibelcharaktere</div>
    </div>
    <button class="icon-btn" id="header-search-btn" aria-label="Suchen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </header>

  <main>

    <!-- HOME VIEW -->
    <section class="view active" id="view-home">
      <div class="verse-banner">
        <p class="verse-eyebrow">Vers des Tages</p>
        <p class="verse-text" id="verse-text"></p>
        <p class="verse-ref" id="verse-ref"></p>
      </div>

      <p class="intro-text">Entdecke die Menschen der Bibel &ndash; ihre Geschichten, ihre Fehler, ihren Glauben, und was sie uns heute noch zu sagen haben.</p>

      <div class="section-head">
        <h2>Im Fokus</h2>
        <span class="link" id="home-see-all">Alle ansehen &rarr;</span>
      </div>
      <div class="featured-scroll" id="featured-scroll"></div>

      <div class="section-head" style="margin-top:28px;">
        <h2>Kategorien</h2>
      </div>
      <div class="chip-row" id="home-categories"></div>
    </section>

    <!-- CHARAKTERE VIEW -->
    <section class="view" id="view-list">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Name oder Stichwort suchen&hellip;">
      </div>
      <div class="chip-row" id="list-chips"></div>
      <div class="char-list" id="char-list"></div>
    </section>

    <!-- MERKLISTE VIEW -->
    <section class="view" id="view-merkliste">
      <div class="section-head">
        <h2>Meine Merkliste</h2>
      </div>
      <div id="merkliste-content"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>Start</span>
    </button>
    <button class="tab-btn" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11a2 2 0 0 1 2 2v14l-7-3-7 3V6a2 2 0 0 1 1-2Z"/></svg>
      <span>Charaktere</span>
    </button>
    <button class="tab-btn" data-tab="merkliste">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>
      <span>Merkliste</span>
    </button>
  </nav>

  <!-- DETAIL VIEW -->
  <div id="detail-view">
    <div class="detail-header">
      <button class="icon-btn" id="detail-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <button class="bookmark-toggle" id="detail-bookmark-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>
        <span id="bookmark-label">Merken</span>
      </button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>

</div>

<script>
/* ---------- DATEN ---------- */
const CHARACTERS = [
{id:"adam-eva",name:"Adam & Eva",testament:"AT",category:"Anfänge",era:"Schöpfung",
teaser:"Die ersten Menschen im Garten Eden",
story:"Gott erschafft Adam aus Erde und haucht ihm Leben ein, und formt Eva als seine Gefährtin. Im Garten Eden leben sie in enger Gemeinschaft mit Gott, bis eine Schlange Eva verführt, von der verbotenen Frucht der Erkenntnis zu essen. Adam isst ebenfalls davon. Ihr Ungehorsam trennt sie von der Nähe zu Gott, und sie müssen den Garten verlassen.",
lesson:"Freiheit bedeutet auch Verantwortung. Schon die erste Geschichte der Bibel zeigt: Fehlentscheidungen haben Folgen, doch Gott verlässt die Menschen selbst dann nicht.",

{id:"noah",name:"Noah",testament:"AT",category:"Anfänge",era:"Vor der Sintflut",
teaser:"Baute die Arche und rettete seine Familie",
story:"In einer Zeit, in der die Menschheit sich von Gott abgewandt hat, findet Noah Gnade in Gottes Augen. Gott beauftragt ihn, eine riesige Arche zu bauen, um seine Familie und Tierpaare vor einer bevorstehenden Flut zu retten. Trotz Spott baut Noah über Jahre hinweg gehorsam weiter. Die Flut kommt, doch Noah und alle in der Arche überleben.",

{id:"abraham",name:"Abraham",testament:"AT",category:"Erzväter",era:"Zeit der Erzväter",

story:"Gott ruft Abraham auf, seine Heimat zu verlassen und in ein unbekanntes Land zu ziehen, mit dem Versprechen, ihn zu einem großen Volk zu machen. Abraham gehorcht, obwohl er und seine Frau Sara kinderlos und schon alt sind. Jahre später wird ihm Sohn Isaak geboren. Später stellt Gott Abrahams Glauben auf die Probe, indem er ihn bittet, Isaak zu opfern &ndash; Abraham gehorcht, und im letzten Moment greift Gott ein.",

{id:"sara",name:"Sara",testament:"AT",category:"Frauen",era:"Zeit der Erzväter",

{id:"isaak",name:"Isaak",testament:"AT",category:"Erzväter",era:"Zeit der Erzväter",

story:"Isaak wird als Sohn der Verheißung geboren, nachdem seine Eltern jahrzehntelang auf ihn gewartet hatten. Als junger Mann erlebt er, wie sein Vater bereit ist, ihn auf Gottes Geheiß zu opfern, wird aber im letzten Augenblick verschont. Später heiratet er Rebekka und setzt den Bund Gottes mit seiner Familie fort.",
lesson:"Manchmal sind wir Teil einer größeren Geschichte, die schon vor uns begonnen hat. Isaaks Leben erinnert daran, dass Vertrauen oft über Generationen weitergegeben wird.",

{id:"jakob",name:"Jakob",testament:"AT",category:"Erzväter",era:"Zeit der Erzväter",

story:"Als Baby aus dem Nil gerettet, wächst Mose am ägyptischen Hof auf, flieht aber nach einem Totschlag in die Wüste. Dort begegnet ihm Gott in einem brennenden Dornbusch und beauftragt ihn, sein Volk aus der Sklaverei zu befreien. Trotz Selbstzweifeln konfrontiert Mose den Pharao, führt Israel durch das geteilte Meer und empfängt am Berg Sinai die Zehn Gebote.",

{id:"aaron",name:"Aaron",testament:"AT",category:"Führer",era:"Auszug aus Ägypten",

lesson:"Selbst Menschen in geistlicher Verantwortung sind nicht vor Fehlern gefeit. Aarons Leben zeigt, wie wichtig es ist, dem Druck der Menge zu widerstehen.",
verseRef:"2. Mose 4; 32"},

{id:"mirjam",name:"Mirjam",testament:"AT",category:"Frauen",era:"Auszug aus Ägypten",
teaser:"Prophetin und Schwester des Mose",
story:"Als kleines Mädchen bewacht Mirjam ihren Bruder Mose im Binsenkörbchen am Nilufer und sorgt geschickt dafür, dass ihre Mutter ihn aufziehen darf. Als Erwachsene wird sie als Prophetin anerkannt und führt nach der Rettung am Meer die Frauen in einem Loblied an.",
lesson:"Mirjam erinnert daran, dass mutiges, kluges Handeln im Kleinen große Auswirkungen haben kann.",
verseRef:"2. Mose 2; 15"},

{id:"josua",name:"Josua",testament:"AT",category:"Führer",era:"Landnahme",
teaser:"Führte Israel ins verheißene Land",
story:"Josua dient jahrelang als Moses Gehilfe und wird nach dessen Tod zum neuen Anführer Israels. Mit dem Auftrag „Sei stark und mutig“ führt er das Volk über den Jordan ins verheißene Land und erlebt den Fall der Stadt Jericho, deren Mauern nach einem von Gott angeordneten Umzug einstürzen.",
lesson:"Mut wächst oft aus der Zusage, dass man nicht allein ist. Josuas Geschichte zeigt, wie wichtig es ist, an begonnenen Aufgaben treu dranzubleiben.",
verseRef:"Josua 1; 6"},

{id:"debora",name:"Debora",testament:"AT",category:"Frauen",era:"Zeit der Richter",
teaser:"Richterin und Prophetin, die Israel in die Freiheit führte",
story:"Debora ist die einzige Richterin Israels und wird für ihre Weisheit von weit her aufgesucht. Als das Volk unter der Unterdrückung eines kanaanäischen Königs leidet, ruft sie den zögernden Feldherrn Barak zum Kampf auf und begleitet ihn selbst in die Schlacht, die zur Befreiung Israels führt.",
lesson:"Debora zeigt, dass Gott Menschen unabhängig von Erwartungen der Gesellschaft zu Führungspersonen beruft, wenn sie mutig Verantwortung übernehmen.",
verseRef:"Richter 4-5"},

{id:"gideon",name:"Gideon",testament:"AT",category:"Führer",era:"Zeit der Richter",
teaser:"Vom zweifelnden Bauern zum Befreier Israels",
story:"Gideon versteckt sich beim Dreschen von Weizen vor den Midianitern, als ein Engel ihn als „starken Helden“ anspricht. Trotz großer Selbstzweifel und mehrfachem Bitten um Zeichen von Gott führt er schließlich mit nur dreihundert Mann einen überraschenden Sieg gegen ein riesiges feindliches Heer.",
lesson:"Gott braucht keine große Zahl oder makellose Helden, um Großes zu bewirken &ndash; oft zeigt sich seine Kraft gerade in kleinen, unscheinbaren Mitteln.",
verseRef:"Richter 6-7"},

{id:"ruth",name:"Ruth",testament:"AT",category:"Frauen",era:"Zeit der Richter",
teaser:"Blieb ihrer Schwiegermutter treu und fand eine neue Heimat",
story:"Nach dem Tod ihres Mannes entscheidet sich die Moabiterin Ruth, ihre verwitwete Schwiegermutter Noomi nicht zu verlassen, sondern mit ihr nach Bethlehem zu ziehen &ndash; in ein fremdes Land und Volk. Dort sammelt sie Ähren auf den Feldern des wohlhabenden Boas, der ihre Treue bemerkt und sie später heiratet. Sie wird zur Urgroßmutter König Davids.",
lesson:"Treue und Loyalität, auch wenn sie schwierig sind, können zu Wegen führen, die man sich nie hätte vorstellen können.",
verseRef:"Rut 1-4"},

{id:"hanna",name:"Hanna",testament:"AT",category:"Frauen",era:"Zeit der Richter",
teaser:"Betete um ein Kind und schenkte es Gott zurück",
story:"Jahrelang leidet Hanna unter Kinderlosigkeit und wird deswegen verspottet. Im Tempel betet sie so inbrünstig um einen Sohn, dass der Priester Eli sie zunächst für betrunken hält. Gott erhört ihr Gebet mit der Geburt Samuels, den sie, ihrem Versprechen treu, schon als kleines Kind in den Dienst am Tempel gibt.",
lesson:"Ehrliches, beharrliches Gebet in tiefem Schmerz kann Türen öffnen. Hanna zeigt auch, wie schwer und zugleich schön es ist, ein Versprechen an Gott zu halten.",
verseRef:"1. Samuel 1-2"},

{id:"samuel",name:"Samuel",testament:"AT",category:"Propheten",era:"Zeit der Könige",
teaser:"Hörte als Kind Gottes Stimme im Tempel",
story:"Als Kind im Tempel aufgewachsen, hört Samuel eines Nachts Gott ihn beim Namen rufen und lernt, seine Stimme zu erkennen und zu antworten: „Rede, Herr, denn dein Diener hört.“ Er wird zum letzten Richter und bedeutendsten Propheten seiner Zeit, salbt Saul und später David zum König.",
lesson:"Gott spricht oft leise und in Momenten der Stille. Samuels Geschichte lädt dazu ein, zuzuhören und offen zu bleiben, auch wenn man jung oder unerfahren ist.",
verseRef:"1. Samuel 3"},

{id:"saul",name:"Saul",testament:"AT",category:"Könige",era:"Zeit der Könige",
teaser:"Israels erster König, scheiterte an Stolz und Ungehorsam",
story:"Saul wird als hochgewachsener, zunächst bescheidener Mann zum ersten König Israels gesalbt. Mit der Zeit wird er jedoch ungeduldig und ungehorsam gegenüber Gottes Anweisungen, und Eifersucht auf den jungen David zerfrisst ihn zunehmend. Sein Königtum endet tragisch in Niederlage und Verzweiflung.",
lesson:"Sauls Leben warnt davor, wie Stolz und Kontrollverlust über die eigene Eifersucht eine vielversprechende Berufung zerstören können.",
verseRef:"1. Samuel 9-31"},

{id:"david",name:"David",testament:"AT",category:"Könige",era:"Zeit der Könige",
teaser:"Vom Hirtenjungen zum König, besiegte Goliath",
story:"Als jüngster Sohn eines Hirten wird David unerwartet zum König gesalbt und besiegt kurz darauf mit einer Steinschleuder den Riesen Goliath. Er wird zu Israels größtem König, ist aber auch für seine schwere Schuld verantwortlich, als er Batseba begehrt und ihren Mann in den Tod schickt. Nach Reue und Buße bleibt er dennoch „ein Mann nach Gottes Herzen“.",
lesson:"Davids Leben zeigt, dass Größe im Glauben und tiefes Versagen nebeneinander bestehen können &ndash; und dass aufrichtige Reue immer möglich ist.",
verseRef:"1. Samuel 16 &ndash; 2. Samuel 12"},

{id:"batseba",name:"Batseba",testament:"AT",category:"Frauen",era:"Zeit der Könige",
teaser:"Wurde später Mutter König Salomos",
story:"Batseba wird von König David begehrt, während ihr Mann Uria im Krieg dient; David lässt ihn absichtlich in der Schlacht sterben. Trotz dieses schmerzvollen Anfangs wird sie später Davids Frau und Mutter Salomos, den sie klug für den Thron unterstützt.",
lesson:"Auch aus gebrochenen und ungerechten Anfängen kann durch Gottes Gnade ein neuer Weg entstehen.",
verseRef:"2. Samuel 11-12; 1. Könige 1"},

{id:"salomo",name:"Salomo",testament:"AT",category:"Könige",era:"Zeit der Könige",
teaser:"Bat um Weisheit und baute den ersten Tempel",
story:"Als er von Gott einen Wunsch frei bekommt, bittet Salomo nicht um Reichtum oder ein langes Leben, sondern um ein „hörendes Herz“, um sein Volk weise zu regieren. Er wird für seine Weisheit weltberühmt, baut den prächtigen Tempel in Jerusalem, wendet sich aber im Alter fremden Göttern zu.",
lesson:"Weisheit ist mehr wert als Reichtum, doch selbst die klügsten Menschen sind nicht vor Irrwegen geschützt.",
verseRef:"1. Könige 3-11"},

{id:"elia",name:"Elia",testament:"AT",category:"Propheten",era:"Geteiltes Königreich",
teaser:"Prophet, der auf dem Karmel gegen Baal siegte",
story:"Elia tritt mutig gegen König Ahab und die Baalspriester an und ruft auf dem Berg Karmel öffentlich Feuer vom Himmel herab, um zu zeigen, dass der Herr der wahre Gott ist. Doch kurz darauf verfällt er aus Angst vor Königin Isebel in tiefe Erschöpfung und Verzweiflung, bis Gott ihm in einem sanften Windhauch begegnet und ihn stärkt.",
lesson:"Selbst die mutigsten Glaubenshelden erleben Erschöpfung und Zweifel. Elias Geschichte zeigt, dass Gott gerade dann Ruhe und Ermutigung schenkt.",
verseRef:"1. Könige 18-19"},

{id:"elisa",name:"Elisa",testament:"AT",category:"Propheten",era:"Geteiltes Königreich",
teaser:"Übernahm Elias Auftrag mit doppeltem Geist",
story:"Elisa verlässt seinen Bauernhof, um Elia als Diener und Nachfolger zu folgen. Nach Elias Himmelfahrt wirkt er zahlreiche Wunder &ndash; er heilt den aussätzigen Naaman, vermehrt Öl für eine verarmte Witwe und erweckt einen toten Jungen wieder zum Leben.",
lesson:"Treue Nachfolge im Kleinen kann zu einem Leben führen, das anderen konkret Hoffnung und Heilung bringt.",
verseRef:"2. Könige 2-5"},

{id:"jesaja",name:"Jesaja",testament:"AT",category:"Propheten",era:"Geteiltes Königreich",
teaser:"Prophet der Hoffnung inmitten des Gerichts",
story:"Jesaja erlebt in einer eindrücklichen Vision Gottes Herrlichkeit im Tempel und erklärt sich trotz seiner Unwürdigkeit bereit, als Prophet zu dienen: „Hier bin ich, sende mich.“ Über Jahrzehnte warnt er Israel vor den Folgen der Untreue, verkündet aber zugleich eindringliche Verheißungen von Trost und einem kommenden Retter.",
lesson:"Jesajas Berufung zeigt, dass Gott auch unsichere Menschen sendet, sobald sie bereit sind, „Hier bin ich“ zu sagen.",
verseRef:"Jesaja 6"},

{id:"jeremia",name:"Jeremia",testament:"AT",category:"Propheten",era:"Vor dem Exil",
teaser:"Der weinende Prophet, treu trotz Ablehnung",
story:"Jeremia wird schon als junger Mann berufen, dem Volk Juda unbequeme Warnungen zu verkünden, wird dafür verspottet, eingesperrt und in eine Zisterne geworfen. Trotz aller Ablehnung bleibt er über Jahrzehnte treu und beklagt zugleich das Leid seines Volkes zutiefst.",
lesson:"Treue zu Gott bedeutet manchmal, unpopuläre Wahrheiten zu sagen, selbst wenn es einsam macht.",
verseRef:"Jeremia 1; 38"},

{id:"daniel",name:"Daniel",testament:"AT",category:"Propheten",era:"Babylonisches Exil",
teaser:"Blieb treu in der Löwengrube und am fremden Hof",
story:"Als junger Verbannter am babylonischen Hof weigert sich Daniel, sich mit unreinem Essen des Königs zu verunreinigen, und bleibt seinem Glauben treu. Später wird er wegen seines Gebets zu Gott in eine Löwengrube geworfen, doch Gott bewahrt ihn unversehrt. Er dient mehreren Königen als weiser Ratgeber und Traumdeuter.",
lesson:"Standhaftigkeit im Kleinen bereitet oft auf größere Prüfungen vor. Daniel zeigt, dass Integrität selbst unter Druck möglich ist.",
verseRef:"Daniel 1; 6"},

{id:"jona",name:"Jona",testament:"AT",category:"Propheten",era:"Geteiltes Königreich",
teaser:"Floh vor Gottes Auftrag und landete im Fisch",
story:"Statt der ihm verhassten Stadt Ninive Gottes Botschaft zu bringen, flieht Jona mit einem Schiff in die entgegengesetzte Richtung. Ein gewaltiger Sturm und drei Tage im Bauch eines großen Fisches bringen ihn zur Besinnung. Er predigt schließlich doch in Ninive &ndash; und ärgert sich, als die Stadt sich bekehrt und Gott ihr vergibt.",
lesson:"Jonas Geschichte konfrontiert uns mit der Frage, ob wir Gottes Gnade auch denen gönnen, die wir für unwürdig halten.",
verseRef:"Jona 1-4"},

{id:"esther",name:"Esther",testament:"AT",category:"Frauen",era:"Persisches Exil",
teaser:"Rettete ihr Volk als Königin im Verborgenen",
story:"Die jüdische Waise Esther wird unerwartet Königin von Persien, während sie ihre Herkunft zunächst verbirgt. Als der Höfling Haman die Vernichtung aller Juden plant, riskiert Esther ihr Leben, indem sie ungebeten vor den König tritt und ihr Volk rettet.",
lesson:"„Wer weiß, ob du nicht gerade für diese Zeit an diese Stelle gelangt bist“ &ndash; Esthers Geschichte erinnert daran, dass mutiges Handeln zur rechten Zeit viel bewirken kann.",
verseRef:"Ester 4-7"},

{id:"hiob",name:"Hiob",testament:"AT",category:"Weisheit",era:"Unbestimmt",
teaser:"Hielt an Gott fest trotz größten Leids",
story:"Hiob, ein wohlhabender und gottesfürchtiger Mann, verliert innerhalb kurzer Zeit seinen Besitz, seine Kinder und seine Gesundheit. Seine Freunde suchen vergeblich nach Erklärungen für sein Leid, doch Hiob ringt ehrlich mit Gott, ohne ihn zu verfluchen. Am Ende begegnet ihm Gott selbst, und Hiob findet neuen Frieden.",
lesson:"Hiobs Geschichte zeigt, dass Leid nicht immer erklärbar ist, aber ehrliches Ringen mit Gott einen tragfähigen Glauben bilden kann.",
verseRef:"Hiob 1-2; 42"},

{id:"johannes-taeufer",name:"Johannes der Täufer",testament:"NT",category:"Wegbereiter",era:"Leben Jesu",
teaser:"Bereitete den Weg für den Messias",
story:"Johannes lebt asketisch in der Wüste und ruft die Menschen eindringlich zur Umkehr auf. Er tauft im Jordan und erkennt schließlich Jesus als den, „der nach mir kommt“ und größer ist als er selbst. Seine offene Kritik am König Herodes kostet ihn später das Leben.",
lesson:"Johannes zeigt beispielhafte Demut: Er stellt sich bewusst in den Hintergrund, damit Jesus im Vordergrund stehen kann.",
verseRef:"Matthäus 3; Markus 6"},

{id:"maria",name:"Maria, Mutter Jesu",testament:"NT",category:"Frauen",era:"Leben Jesu",
teaser:"Sagte Ja zu Gottes ungewöhnlichem Plan",
story:"Als junge Frau aus Nazaret erhält Maria die überraschende Nachricht eines Engels, dass sie den Sohn Gottes zur Welt bringen wird. Trotz der gesellschaftlichen Schwierigkeiten, die eine solche Schwangerschaft mit sich bringt, antwortet sie: „Mir geschehe, wie du gesagt hast.“ Sie begleitet Jesus durch sein ganzes Leben, bis unter das Kreuz.",
lesson:"Marias Antwort zeigt, was es bedeutet, Gottes Plan zu vertrauen, auch wenn er den eigenen Erwartungen völlig widerspricht.",
verseRef:"Lukas 1-2"},

{id:"joseph-ehemann",name:"Josef, Mann Marias",testament:"NT",category:"Wegbereiter",era:"Leben Jesu",
teaser:"Stiller, treuer Beschützer der heiligen Familie",
story:"Josef, ein Zimmermann aus Nazaret, ist zunächst verunsichert, als seine Verlobte Maria schwanger wird, ist aber bereit, sie leise zu verlassen, um sie nicht bloßzustellen. Nach einer Engelserscheinung im Traum nimmt er Maria dennoch zur Frau, kümmert sich um das Kind Jesus und beschützt die Familie sogar auf der Flucht nach Ägypten.",
lesson:"Josef handelt nie spektakulär, sondern still und treu &ndash; ein Beispiel dafür, dass Glauben oft in unauffälligem, verlässlichem Handeln sichtbar wird.",
verseRef:"Matthäus 1-2"},

{id:"jesus",name:"Jesus Christus",testament:"NT",category:"Zentrale Gestalt",era:"Leben Jesu",
teaser:"Sohn Gottes, Lehrer, gekreuzigt und auferstanden",
story:"Jesus wird in Bethlehem geboren, wächst in Nazaret auf und beginnt mit etwa dreißig Jahren seinen öffentlichen Dienst. Er lehrt in Gleichnissen, heilt Kranke, wendet sich Ausgestoßenen zu und ruft zur Liebe zu Gott und zum Nächsten auf. Nach seiner Kreuzigung in Jerusalem, mit der er die Schuld der Menschen trägt, wird er nach christlichem Glauben am dritten Tag von den Toten auferweckt.",
lesson:"Jesu Leben und Botschaft laden dazu ein, Liebe, Vergebung und Hoffnung neu zu verstehen &ndash; als Geschenk, nicht als Leistung.",
verseRef:"Die vier Evangelien"},

{id:"petrus",name:"Petrus",testament:"NT",category:"Apostel",era:"Frühe Kirche",
teaser:"Verleugnete Jesus und wurde dennoch zum Fels der Kirche",
story:"Der Fischer Simon Petrus wird von Jesus berufen, „Menschenfischer“ zu werden, und gehört zu seinem engsten Kreis. In der Nacht vor der Kreuzigung verleugnet er Jesus aus Angst dreimal, bricht danach zusammen. Doch der auferstandene Jesus vergibt ihm und beauftragt ihn erneut, und Petrus wird zu einem der führenden Apostel der jungen Kirche.",
lesson:"Petrus zeigt, dass Versagen nicht das letzte Wort haben muss. Vergebung kann aus einem gescheiterten Menschen einen mutigen Zeugen machen.",
verseRef:"Matthäus 26; Johannes 21; Apostelgeschichte 2"},

{id:"paulus",name:"Paulus",testament:"NT",category:"Apostel",era:"Frühe Kirche",
teaser:"Vom Christenverfolger zum größten Missionar",
story:"Als Saulus verfolgt er die junge christliche Gemeinde mit großem Eifer, bis ihm auf dem Weg nach Damaskus der auferstandene Jesus in einem gleißenden Licht erscheint. Von diesem Moment an wird er selbst zum überzeugten Nachfolger, bereist als Paulus weite Teile des Mittelmeerraums als Missionar und schreibt zahlreiche Briefe, die heute Teil des Neuen Testaments sind.",
lesson:"Niemand steht außerhalb der Reichweite von Veränderung. Paulus zeigt, dass selbst eine radikale Kehrtwende möglich ist.",
verseRef:"Apostelgeschichte 9; Römerbrief"},

{id:"johannes",name:"Johannes, der Apostel",testament:"NT",category:"Apostel",era:"Frühe Kirche",
teaser:"Der Jünger, den Jesus besonders liebte",
story:"Johannes gehört gemeinsam mit Petrus und seinem Bruder Jakobus zum engsten Kreis um Jesus und wird im Evangelium als „der Jünger, den Jesus liebte“ beschrieben. Unter dem Kreuz übernimmt er die Fürsorge für Maria, die Mutter Jesu. Später schreibt er nach christlicher Überlieferung ein Evangelium, Briefe und die Offenbarung.",
lesson:"Johannes' Leben ist geprägt von einer tiefen, persönlichen Beziehung zu Jesus &ndash; ein Beispiel dafür, wie Nähe zu Gott den ganzen Charakter prägen kann.",
verseRef:"Johannes 13; 19; 21"},

{id:"maria-magdalena",name:"Maria Magdalena",testament:"NT",category:"Frauen",era:"Leben Jesu",
teaser:"Erste Zeugin der Auferstehung",
story:"Maria aus Magdala wird von Jesus von schwerer innerer Not befreit und folgt ihm fortan als treue Jüngerin, auch bis unter das Kreuz. Am Ostermorgen ist sie die Erste, die das leere Grab findet und dem auferstandenen Jesus begegnet &ndash; er beauftragt sie, den anderen Jüngern die Nachricht zu bringen.",
lesson:"Maria Magdalena zeigt, dass Gott gerade Menschen mit schwerer Vergangenheit eine besondere Aufgabe und Würde schenken kann.",
verseRef:"Lukas 8; Johannes 20"},

{id:"thomas",name:"Thomas",testament:"NT",category:"Apostel",era:"Leben Jesu",
teaser:"Zweifelte, bis er selbst sah",
story:"Thomas ist bei der ersten Erscheinung des auferstandenen Jesus vor den Jüngern nicht anwesend und weigert sich, ohne eigenen Beweis zu glauben. Eine Woche später erscheint Jesus erneut und lädt Thomas ein, seine Wunden zu berühren &ndash; woraufhin Thomas bekennt: „Mein Herr und mein Gott.“",
lesson:"Zweifel ist kein Gegensatz zum Glauben, sondern kann Teil des Weges dorthin sein. Jesus begegnet Thomas in seiner Unsicherheit, statt ihn zu verurteilen.",
verseRef:"Johannes 20"},

{id:"judas",name:"Judas Iskariot",testament:"NT",category:"Apostel",era:"Leben Jesu",
teaser:"Verriet Jesus für dreißig Silberstücke",
story:"Judas gehört zu den zwölf engsten Jüngern Jesu und verwaltet ihre gemeinsame Kasse. Aus Gründen, die die Evangelien unterschiedlich deuten, verrät er Jesus für dreißig Silberstücke an die religiösen Führer. Nach der Verurteilung Jesu überwältigt ihn die Reue, und er nimmt sich das Leben.",
lesson:"Judas' Geschichte ist eine ernste Warnung davor, wohin unkontrollierte Enttäuschung oder Habgier führen können, wenn sie nicht offen angesprochen werden.",
verseRef:"Matthäus 26-27"},

{id:"lazarus",name:"Lazarus",testament:"NT",category:"Weggefährten",era:"Leben Jesu",
teaser:"Von Jesus vom Tod auferweckt",
story:"Lazarus aus Betanien, Freund Jesu und Bruder von Marta und Maria, erkrankt schwer und stirbt, während Jesus noch unterwegs ist. Vier Tage nach der Beerdigung kommt Jesus und ruft Lazarus mit lauter Stimme aus dem Grab &ndash; eines der eindrücklichsten Wunder, das Jesu Macht über den Tod zeigt.",
lesson:"Lazarus' Auferweckung zeigt, dass Jesus selbst dort noch Hoffnung bringt, wo menschlich gesehen alles zu spät scheint.",
verseRef:"Johannes 11"},

{id:"zachaeus",name:"Zachäus",testament:"NT",category:"Weggefährten",era:"Leben Jesu",
teaser:"Bestechlicher Zollbeamter, der umkehrte",
story:"Der kleinwüchsige und wohlhabende Zollbeamte Zachäus, verachtet wegen seiner Betrügereien, klettert vor Neugier auf einen Baum, um Jesus zu sehen. Zu seiner Überraschung lädt Jesus sich selbst zu ihm nach Hause ein. Berührt von dieser Begegnung, gibt Zachäus die Hälfte seines Besitzes den Armen und erstattet Betrogenen das Vierfache zurück.",
lesson:"Zachäus zeigt, dass echte Begegnung mit Jesus konkrete, praktische Veränderung im Alltag bewirken kann.",
verseRef:"Lukas 19"},

{id:"timotheus",name:"Timotheus",testament:"NT",category:"Weggefährten",era:"Frühe Kirche",
teaser:"Junger Mitarbeiter und geistlicher Sohn des Paulus",
story:"Timotheus wächst mit einer gläubigen Mutter und Großmutter auf und schließt sich als junger Mann Paulus auf dessen Missionsreisen an. Paulus vertraut ihm später wichtige Aufgaben in den Gemeinden an und ermutigt ihn in zwei persönlichen Briefen, sich trotz seiner Jugend nicht entmutigen zu lassen.",
lesson:"Timotheus zeigt, dass auch junge oder unerfahrene Menschen wichtige geistliche Verantwortung übernehmen können, wenn erfahrene Begleiter sie ermutigen.",
verseRef:"1. & 2. Timotheus"},

{id:"kain-abel",name:"Kain & Abel",testament:"AT",category:"Anfänge",era:"Nach dem Sündenfall",
teaser:"Die ersten Brüder, geprägt von Eifersucht und Schuld",
story:"Kain und Abel, die Söhne Adams und Evas, bringen Gott jeweils ein Opfer dar. Als Gott Abels Opfer wohlgefällig annimmt, Kains jedoch nicht, wird Kain von Zorn und Eifersucht überwältigt und erschlägt seinen Bruder im Feld. Auf Gottes Frage „Wo ist dein Bruder Abel?“ antwortet er ausweichend, muss aber fortan rastlos umherirren.",
lesson:"Unkontrollierte Eifersucht kann verheerende Folgen haben. Die Geschichte mahnt, aufkommendem Groll früh zu begegnen, statt ihn wachsen zu lassen.",
verseRef:"1. Mose 4"},

{id:"henoch",name:"Henoch",testament:"AT",category:"Anfänge",era:"Vor der Sintflut",
teaser:"Wandelte mit Gott und wurde hinweggenommen",
story:"Über Henoch berichtet die Bibel nur wenig, doch es heißt eindrücklich, dass er „mit Gott wandelte“. Nach 365 Lebensjahren wird er nicht wie andere Menschen als gestorben beschrieben, sondern von Gott direkt hinweggenommen.",
lesson:"Ein Leben in enger, beständiger Nähe zu Gott prägt den Alltag mehr als äußere Leistungen.",
verseRef:"1. Mose 5,21-24"},

{id:"lot",name:"Lot",testament:"AT",category:"Erzväter",era:"Zeit der Erzväter",
teaser:"Abrahams Neffe, gerettet aus dem untergehenden Sodom",
story:"Lot, Abrahams Neffe, lässt sich in der Stadt Sodom nieder, die für ihre Bosheit bekannt ist. Als Gott beschließt, die Stadt zu zerstören, warnen zwei Engel Lot und seine Familie und drängen sie zur Flucht, mit der Anweisung, nicht zurückzublicken. Seine Frau blickt dennoch zurück und erstarrt, während Lot selbst gerettet wird.",
lesson:"Manchmal bedeutet Rettung, konsequent loszulassen und nicht an dem festzuhalten, was man zurücklässt.",
verseRef:"1. Mose 19"},

{id:"rebekka",name:"Rebekka",testament:"AT",category:"Frauen",era:"Zeit der Erzväter",
teaser:"Isaaks Frau, die am Brunnen Gastfreundschaft zeigte",
story:"Als Abrahams Diener eine Frau für Isaak sucht, erkennt er Rebekka an ihrer spontanen Gastfreundschaft, als sie ihm und seinen Kamelen am Brunnen Wasser gibt. Sie verlässt bereitwillig ihre Familie, um Isaak zu heiraten, und wird später Mutter der Zwillinge Jakob und Esau, wobei sie Jakob bei der List um den Erstgeburtssegen unterstützt.",
lesson:"Rebekkas Geschichte zeigt, wie kleine Gesten der Freundlichkeit große Weichen stellen können &ndash; aber auch, wie Bevorzugung innerhalb einer Familie Konflikte schürt.",
verseRef:"1. Mose 24; 27"},

{id:"lea",name:"Lea",testament:"AT",category:"Frauen",era:"Zeit der Erzväter",
teaser:"Die ungeliebte Frau, die dennoch reich gesegnet wurde",
story:"Lea wird von ihrem Vater Laban durch eine List anstelle ihrer Schwester Rahel mit Jakob verheiratet, der sie zeitlebens weniger liebt als Rahel. Trotz dieser schmerzhaften Zurücksetzung schenkt Gott ihr mehrere Söhne, unter ihnen Juda, aus dessen Stamm später David und Jesus hervorgehen.",
lesson:"Leas Geschichte zeigt, dass Gott gerade übersehene Menschen sieht und ihnen eine bedeutsame Rolle zutraut.",
verseRef:"1. Mose 29"},

{id:"rahel",name:"Rahel",testament:"AT",category:"Frauen",era:"Zeit der Erzväter",
teaser:"Jakobs geliebte Frau, lange kinderlos",
story:"Rahel ist die große Liebe Jakobs, für die er vierzehn Jahre arbeitet. Lange bleibt sie kinderlos und leidet sichtlich unter dem Vergleich mit ihrer Schwester Lea, bis sie schließlich Josef und später Benjamin zur Welt bringt, bei dessen Geburt sie stirbt.",
lesson:"Rahels Sehnsucht erinnert daran, dass Warten und Vergleichen mit anderen oft zu den schwersten Prüfungen des Glaubens gehören.",
verseRef:"1. Mose 29-35"},

{id:"juda",name:"Juda",testament:"AT",category:"Erzväter",era:"Zeit der Erzväter",
teaser:"Jakobs Sohn, aus dessen Stamm David und Jesus stammen",
story:"Juda schlägt vor, Josef statt ihn zu töten lieber zu verkaufen, trägt also Mitschuld an dessen Leid. Jahre später beweist er in Ägypten echte Reue und bietet sich sogar an, anstelle seines jüngeren Bruders Benjamin in Gefangenschaft zu bleiben. Aus seinem Stamm gehen später König David und schließlich Jesus hervor.",
lesson:"Judas Wandel von Mitschuld zu selbstlosem Einstehen für andere zeigt, dass sich Charakter im Laufe eines Lebens tiefgreifend verändern kann.",
verseRef:"1. Mose 37; 44; 49"},

{id:"hagar",name:"Hagar",testament:"AT",category:"Frauen",era:"Zeit der Erzväter",
teaser:"Ägyptische Magd, von Gott in der Wüste gesehen",
story:"Hagar, Saras Magd, wird auf Saras Drängen Mutter von Abrahams Sohn Ismael, gerät aber danach zweimal in Konflikt mit Sara und flieht in die Wüste. Dort begegnet ihr Gott persönlich, tröstet sie und verspricht, auch aus Ismael ein großes Volk entstehen zu lassen.",
lesson:"Hagars Geschichte zeigt eindrücklich, dass Gott gerade die Ausgestoßenen und Übersehenen sieht und ihnen zuwendet.",
verseRef:"1. Mose 16; 21"},

{id:"melchisedek",name:"Melchisedek",testament:"AT",category:"Priester",era:"Zeit der Erzväter",
teaser:"Geheimnisvoller Priesterkönig, dem Abraham den Zehnten gab",
story:"Melchisedek, König von Salem und „Priester Gottes des Höchsten“, tritt Abraham nach einer siegreichen Schlacht mit Brot und Wein entgegen und segnet ihn. Abraham gibt ihm daraufhin den zehnten Teil seiner Beute. Später wird Melchisedek im Neuen Testament als Vorbild für das Priestertum Jesu gedeutet.",
lesson:"Melchisedeks kurzer Auftritt zeigt, dass Gottes Wirken nicht auf eine einzige Volksgruppe beschränkt ist.",
verseRef:"1. Mose 14; Hebräer 7"},

{id:"zippora",name:"Zippora",testament:"AT",category:"Frauen",era:"Auszug aus Ägypten",
teaser:"Moses Frau aus Midian",
story:"Zippora, Tochter eines midianitischen Priesters, lernt Mose am Brunnen kennen, als er vor dem Pharao geflohen ist, und wird seine Frau. Auf dem Weg zurück nach Ägypten greift sie in einer bedrohlichen Situation entschlossen ein, um ihren Mann zu schützen.",
lesson:"Zipporas Geschichte zeigt, dass auch Randfiguren der großen Erzählungen mit mutigem Handeln entscheidend eingreifen können.",
verseRef:"2. Mose 2; 4"},

{id:"bileam",name:"Bileam",testament:"AT",category:"Propheten",era:"Auszug aus Ägypten",
teaser:"Der Seher, dessen Esel sprach",
story:"Der nichtisraelitische Seher Bileam wird von einem feindlichen König angeheuert, um Israel zu verfluchen, doch Gott lässt ihn stattdessen wiederholt Segensworte über Israel sprechen. Auf dem Weg dorthin verweigert seine Eselin plötzlich den Weg, weil sie einen Engel sieht, den Bileam selbst zunächst nicht wahrnimmt.",
lesson:"Bileams Geschichte erinnert daran, dass sich Gottes Pläne nicht durch menschliche Absichten aufhalten lassen, so widerständig sie auch sein mögen.",
verseRef:"4. Mose 22-24"},

{id:"rahab",name:"Rahab",testament:"AT",category:"Frauen",era:"Landnahme",
teaser:"Verbarg die Kundschafter und rettete ihre Familie",
story:"Die Wirtin Rahab aus Jericho versteckt zwei israelitische Kundschafter vor den Häschern des Königs, weil sie von Gottes Taten für Israel gehört hat und an ihn glaubt. Im Gegenzug wird ihr zugesagt, dass sie und ihre Familie bei der Eroberung Jerichos verschont bleiben. Später wird sie sogar Teil des Stammbaums Davids und Jesu.",
lesson:"Rahabs Geschichte zeigt, dass Herkunft oder Vergangenheit niemanden von einem neuen Anfang im Glauben ausschließen.",
verseRef:"Josua 2; 6"},

{id:"barak",name:"Barak",testament:"AT",category:"Führer",era:"Zeit der Richter",
teaser:"Zögerlicher Feldherr an Deboras Seite",
story:"Als die Richterin Debora den Feldherrn Barak zum Kampf gegen die kanaanäischen Unterdrücker ruft, willigt er nur unter der Bedingung ein, dass sie ihn begleitet. Gemeinsam führen sie Israel zu einem entscheidenden Sieg, doch die Ehre für die endgültige Befreiung geht an eine andere Frau, Jaël.",
lesson:"Barak zeigt, dass auch zögerlicher Mut zu echten Ergebnissen führen kann, wenn man sich auf die richtige Unterstützung einlässt.",
verseRef:"Richter 4"},

{id:"simson",name:"Simson",testament:"AT",category:"Führer",era:"Zeit der Richter",
teaser:"Der Kraftmensch, der seiner Schwäche erlag",
story:"Simson wird von Geburt an als Nasiräer bestimmt und erhält übermenschliche Kraft, solange er sein Haar nicht schneidet. Trotz beeindruckender Heldentaten gegen die Philister lässt er sich von seiner Liebe zu Delila immer wieder in gefährliche Situationen verwickeln, bis sie sein Geheimnis verrät und er geblendet und gefangen wird. In seinem letzten Akt bringt er betend noch einmal große Kraft auf, um den Feinden entscheidenden Schaden zuzufügen.",
lesson:"Simsons Leben warnt davor, wie unkontrollierte Schwächen selbst außergewöhnliche Gaben zunichtemachen können &ndash; und zeigt zugleich, dass Gott auch am Ende noch handeln kann.",
verseRef:"Richter 13-16"},

{id:"delila",name:"Delila",testament:"AT",category:"Frauen",era:"Zeit der Richter",
teaser:"Verriet Simsons Geheimnis für Silber",
story:"Delila wird von den Philisterfürsten mit einer großen Summe Silber bestochen, um das Geheimnis von Simsons Kraft herauszufinden. Nach mehreren gescheiterten Versuchen bedrängt sie ihn so lange, bis er ihr die Wahrheit über sein Nasiräer-Gelübde verrät &ndash; woraufhin sie ihn im Schlaf an die Philister ausliefert.",
lesson:"Delilas Geschichte zeigt, wie beharrliches Drängen jemanden schließlich zum Verrat an sich selbst bewegen kann.",
verseRef:"Richter 16"},

{id:"noomi",name:"Noomi",testament:"AT",category:"Frauen",era:"Zeit der Richter",
teaser:"Ruths Schwiegermutter, die aus Bitterkeit zu neuer Hoffnung fand",
story:"Noomi verliert in der Fremde ihren Mann und beide Söhne und kehrt verbittert und mittellos nach Bethlehem zurück, wo sie sich selbst „Mara“, die Bittere, nennt. Durch die Treue ihrer Schwiegertochter Ruth und deren Heirat mit Boas erlebt sie am Ende einen unerwarteten neuen Anfang als Großmutter.",
lesson:"Noomis Geschichte zeigt, dass tiefe Verbitterung nicht das letzte Wort haben muss, wenn treue Beziehungen an unserer Seite bleiben.",
verseRef:"Rut 1-4"},

{id:"eli",name:"Eli",testament:"AT",category:"Führer",era:"Zeit der Richter",
teaser:"Priester und Richter, der Samuel aufzog",
story:"Eli dient als Priester und Richter in Silo und zieht den jungen Samuel im Tempel auf, dem er hilft, Gottes Stimme zu erkennen. Seine eigenen Söhne jedoch missbrauchen ihr priesterliches Amt schwer, ohne dass Eli entschieden eingreift, was letztlich zum Untergang seines Hauses führt.",
lesson:"Elis Geschichte mahnt, dass Nachsicht gegenüber Fehlverhalten naher Menschen schwerwiegende Folgen haben kann.",
verseRef:"1. Samuel 1-4"},

{id:"nathan",name:"Nathan",testament:"AT",category:"Propheten",era:"Zeit der Könige",
teaser:"Prophet, der David mutig mit seiner Schuld konfrontierte",
story:"Der Prophet Nathan tritt vor König David, nachdem dieser Batseba begehrt und ihren Mann Uria in den Tod geschickt hat, und konfrontiert ihn mit einem Gleichnis, das Davids eigene Schuld entlarvt: „Du bist der Mann!“ David reagiert mit aufrichtiger Reue.",
lesson:"Nathans Mut zeigt, dass wahre Freundschaft manchmal bedeutet, unbequeme Wahrheiten offen auszusprechen.",
verseRef:"2. Samuel 12"},

{id:"absalom",name:"Absalom",testament:"AT",category:"Könige",era:"Zeit der Könige",
teaser:"Davids Sohn, dessen Ehrgeiz zur Rebellion führte",
story:"Absalom, ein charismatischer Sohn Davids, gewinnt über Jahre geschickt das Vertrauen des Volkes und stürzt schließlich seinen eigenen Vater in einen offenen Aufstand um den Thron. Der Konflikt endet tragisch mit seinem Tod, der David zutiefst erschüttert: „Absalom, mein Sohn, mein Sohn!“",
lesson:"Absaloms Geschichte zeigt, wie ungezügelter Ehrgeiz selbst engste Familienbande zerstören kann.",
verseRef:"2. Samuel 15-18"},

{id:"isebel",name:"Isebel",testament:"AT",category:"Frauen",era:"Geteiltes Königreich",
teaser:"Königin, die den Baalskult förderte und Elia verfolgte",
story:"Isebel, phönizische Prinzessin und Frau König Ahabs, führt den Baalskult in Israel ein und lässt zahlreiche Propheten des Herrn verfolgen und töten. Nach Elias Sieg auf dem Karmel droht sie ihm mit dem Tod, was ihn in tiefe Angst und Flucht treibt.",
lesson:"Isebels Geschichte zeigt, welchen zerstörerischen Einfluss Macht ohne Gottesfurcht auf eine ganze Nation haben kann.",
verseRef:"1. Könige 18-19; 21"},

{id:"hesekiel",name:"Hesekiel",testament:"AT",category:"Propheten",era:"Babylonisches Exil",
teaser:"Prophet im Exil mit eindrücklichen Visionen",
story:"Hesekiel wird als Priester ins babylonische Exil verschleppt und dort von Gott berufen, dem Volk durch oft drastische Zeichenhandlungen und gewaltige Visionen &ndash; wie das Tal der trockenen Gebeine &ndash; Botschaften von Gericht und Hoffnung zu vermitteln.",
lesson:"Hesekiels Visionen erinnern daran, dass Gott selbst in aussichtslosen Situationen neues Leben schaffen kann.",
verseRef:"Hesekiel 1; 37"},

{id:"amos",name:"Amos",testament:"AT",category:"Propheten",era:"Geteiltes Königreich",
teaser:"Schafhirte, der zum Propheten der Gerechtigkeit wurde",
story:"Amos, ursprünglich ein einfacher Schafhirte aus Juda, wird von Gott berufen, im wohlhabenden Nordreich Israel unbequeme Botschaften gegen soziale Ungerechtigkeit und oberflächliche Frömmigkeit zu verkünden, obwohl er dort auf erbitterten Widerstand stößt.",
lesson:"Amos zeigt, dass Gott auch einfache Menschen ohne religiöse Ausbildung beruft, um unbequeme Wahrheiten auszusprechen.",
verseRef:"Amos 1; 7"},

{id:"hosea",name:"Hosea",testament:"AT",category:"Propheten",era:"Geteiltes Königreich",
teaser:"Prophet, dessen eigene Ehe zum Gleichnis wurde",
story:"Gott beauftragt Hosea, eine untreue Frau zu heiraten, um am eigenen Leib die schmerzliche, aber unermüdliche Liebe Gottes zu seinem untreuen Volk sichtbar zu machen. Trotz wiederholten Vertrauensbruchs seiner Frau Gomer holt Hosea sie immer wieder zurück.",
lesson:"Hoseas Geschichte veranschaulicht eindrücklich, wie beharrlich und geduldig Gottes Liebe selbst bei Untreue bleibt.",
verseRef:"Hosea 1-3"},

{id:"nehemia",name:"Nehemia",testament:"AT",category:"Führer",era:"Nach dem Exil",
teaser:"Baute die Mauern Jerusalems wieder auf",
story:"Als Mundschenk am persischen Königshof erfährt Nehemia vom traurigen Zustand Jerusalems und bittet den König um Erlaubnis, die zerstörten Stadtmauern wieder aufzubauen. Trotz Spott und Sabotageversuchen von Gegnern organisiert er das Volk erfolgreich, sodass die Mauern in nur 52 Tagen fertiggestellt werden.",
lesson:"Nehemias Geschichte zeigt, wie entschlossenes, organisiertes Handeln in Verbindung mit Gebet Großes bewirken kann.",
verseRef:"Nehemia 1-6"},

{id:"esra",name:"Esra",testament:"AT",category:"Führer",era:"Nach dem Exil",
teaser:"Schriftgelehrter, der das Gesetz neu ins Volk brachte",
story:"Der Priester und Schriftgelehrte Esra kehrt aus dem Exil nach Jerusalem zurück und widmet sich mit großem Eifer dem Studium und der Lehre des Gesetzes Gottes. Er ruft das Volk eindringlich zu Umkehr und Erneuerung seines Glaubenslebens auf.",
lesson:"Esras Leben zeigt, wie wichtig es ist, überliefertes Wissen wieder lebendig in den Alltag eines Volkes zurückzubringen.",
verseRef:"Esra 7-10"},

{id:"mordechai",name:"Mordechai",testament:"AT",category:"Weggefährten",era:"Persisches Exil",
teaser:"Esters Cousin, der eine Verschwörung aufdeckte",
story:"Mordechai zieht seine Cousine Esther nach dem Tod ihrer Eltern groß und rät ihr später, ihre jüdische Herkunft am Königshof zunächst zu verbergen. Er deckt eine Mordverschwörung gegen den König auf und ermutigt Esther eindringlich, für ihr bedrohtes Volk einzutreten.",
lesson:"Mordechais Rat zeigt, dass stille Wachsamkeit und der Mut, andere zum Handeln zu ermutigen, oft entscheidend sind.",
verseRef:"Ester 2-10"},

{id:"kaleb",name:"Kaleb",testament:"AT",category:"Führer",era:"Auszug aus Ägypten",
teaser:"Vertraute Gott, als andere Angst hatten",
story:"Als Mose zwölf Kundschafter ins verheißene Land sendet, bringt Kaleb gemeinsam mit Josua einen zuversichtlichen Bericht zurück, während die übrigen zehn aus Angst vor den dortigen Bewohnern das Volk entmutigen. Wegen seines Vertrauens darf Kaleb Jahrzehnte später als hochbetagter Mann noch selbst Land in Besitz nehmen.",
lesson:"Kalebs Geschichte zeigt, dass sich ungeteiltes Vertrauen auf Gott auszahlt, auch wenn man damit in der Minderheit ist.",
verseRef:"4. Mose 13-14; Josua 14"},

{id:"elisabeth",name:"Elisabet",testament:"NT",category:"Frauen",era:"Leben Jesu",
teaser:"Johannes des Täufers Mutter, hochbetagt schwanger",
story:"Elisabet und ihr Mann Zacharias bleiben trotz aufrichtiger Frömmigkeit lange kinderlos, bis ein Engel Zacharias im Tempel die Geburt eines Sohnes ankündigt. Sie wird im hohen Alter Mutter von Johannes dem Täufer und begrüßt ihre schwangere Verwandte Maria mit großer Freude.",
lesson:"Elisabets Geschichte zeigt, dass sich Gottes Verheißungen manchmal erst spät, aber dann umso deutlicher erfüllen.",
verseRef:"Lukas 1"},

{id:"zacharias",name:"Zacharias",testament:"NT",category:"Wegbereiter",era:"Leben Jesu",
teaser:"Priester, der durch Zweifel vorübergehend verstummte",
story:"Als der Priester Zacharias im Tempel die Ankündigung eines Engels erhält, dass seine hochbetagte Frau einen Sohn gebären wird, zweifelt er offen daran und verstummt daraufhin bis zur Geburt des Kindes. Bei der Namensgebung seines Sohnes Johannes kann er wieder sprechen und lobt Gott.",
lesson:"Zacharias' Geschichte zeigt, dass Zweifel menschlich ist, Gottes Pläne aber trotzdem ihren Lauf nehmen.",
verseRef:"Lukas 1"},

{id:"marta",name:"Marta",testament:"NT",category:"Frauen",era:"Leben Jesu",
teaser:"Lazarus' Schwester, zwischen Sorge und Glauben",
story:"Marta empfängt Jesus in ihrem Haus und ist sichtlich mit den Vorbereitungen beschäftigt, während ihre Schwester Maria einfach zu seinen Füßen sitzt und zuhört. Beim Tod ihres Bruders Lazarus spricht sie Jesus gegenüber dennoch ein starkes Glaubensbekenntnis aus: „Ich glaube, dass du der Christus bist.“",
lesson:"Martas Geschichte erinnert daran, dass echter Glaube nicht im Widerspruch zu tatkräftigem Handeln stehen muss.",
verseRef:"Lukas 10; Johannes 11"},

{id:"nikodemus",name:"Nikodemus",testament:"NT",category:"Weggefährten",era:"Leben Jesu",
teaser:"Pharisäer, der Jesus nachts aufsuchte",
story:"Der angesehene Pharisäer und Ratsherr Nikodemus sucht Jesus zunächst heimlich bei Nacht auf, um mehr über seine Lehre zu erfahren, und hört von ihm die Worte über die „neue Geburt“. Später verteidigt er Jesus öffentlicher im Rat und hilft schließlich offen bei dessen Begräbnis mit.",
lesson:"Nikodemus zeigt, dass echter Glaube manchmal Zeit braucht, um von vorsichtigem Zweifel zu offenem Bekenntnis zu wachsen.",
verseRef:"Johannes 3; 19"},

{id:"andreas",name:"Andreas",testament:"NT",category:"Apostel",era:"Leben Jesu",
teaser:"Der erste berufene Jünger, brachte andere zu Jesus",
story:"Andreas, ursprünglich Jünger Johannes des Täufers, gehört zu den ersten, die Jesus nachfolgen, und bringt sogleich seinen Bruder Simon Petrus zu ihm. Auch später tritt er wiederholt als jemand auf, der andere zu Jesus führt, etwa den Jungen mit den fünf Broten und zwei Fischen.",
lesson:"Andreas zeigt, dass nicht jeder im Rampenlicht stehen muss &ndash; manche Menschen wirken vor allem, indem sie andere zusammenbringen.",
verseRef:"Johannes 1; 6"},

{id:"jakobus-zebedaeus",name:"Jakobus, Sohn des Zebedäus",testament:"NT",category:"Apostel",era:"Leben Jesu",
teaser:"Apostel im engsten Kreis Jesu, erster Märtyrer unter den Zwölf",
story:"Jakobus, Bruder des Johannes, gehört gemeinsam mit Petrus zum innersten Kreis der Jünger und ist bei zentralen Momenten wie der Verklärung Jesu dabei. Er wird als erster der zwölf Apostel unter König Herodes Agrippa I. hingerichtet.",
lesson:"Jakobus' Geschichte erinnert daran, dass Nachfolge Jesu auch mit hohem persönlichen Risiko verbunden sein kann.",
verseRef:"Markus 9; Apostelgeschichte 12"},

{id:"philippus-apostel",name:"Philippus",testament:"NT",category:"Apostel",era:"Leben Jesu",
teaser:"Brachte Nathanael zu Jesus",
story:"Philippus wird von Jesus direkt berufen und führt daraufhin seinen skeptischen Freund Nathanael zu ihm mit den Worten: „Komm und sieh!“ Bei der Speisung der Fünftausend fragt Jesus ihn testend, wie sie die Menge versorgen sollen, worauf Philippus zunächst nur die Unmöglichkeit sieht.",
lesson:"Philippus zeigt, dass eine einfache Einladung wie „Komm und sieh“ oft wirkungsvoller ist als lange Überzeugungsversuche.",
verseRef:"Johannes 1; 6"},

{id:"matthaeus",name:"Matthäus",testament:"NT",category:"Apostel",era:"Leben Jesu",
teaser:"Verachteter Zöllner, der Jesus alles verließ",
story:"Matthäus arbeitet als Zolleinnehmer im Dienst der Römer und wird deshalb von seinen jüdischen Landsleuten verachtet. Als Jesus ihn direkt an seinem Zollstand anspricht: „Folge mir nach“, steht er sofort auf, verlässt alles und lädt Jesus zu einem großen Festmahl mit anderen Außenseitern ein.",
lesson:"Matthäus' Berufung zeigt, dass Jesus gezielt zu den gesellschaftlich Verachteten geht und ihnen einen radikalen Neuanfang ermöglicht.",
verseRef:"Matthäus 9"},

{id:"stephanus",name:"Stephanus",testament:"NT",category:"Weggefährten",era:"Frühe Kirche",
teaser:"Erster Märtyrer der jungen Kirche",
story:"Stephanus, einer der ersten Diakone der jungen Gemeinde, predigt mutig und wird deshalb vor den jüdischen Hohen Rat gebracht. Trotz wachsender Feindseligkeit hält er eine leidenschaftliche Rede über Gottes Geschichte mit Israel und wird daraufhin gesteinigt, während er noch für seine Peiniger betet.",
lesson:"Stephanus zeigt, dass Vergebung selbst im Angesicht des eigenen Todes möglich ist.",
verseRef:"Apostelgeschichte 6-7"},

{id:"barnabas",name:"Barnabas",testament:"NT",category:"Weggefährten",era:"Frühe Kirche",
teaser:"Der 'Sohn des Trostes', der Paulus zur Seite stand",
story:"Barnabas verkauft freiwillig eigenen Besitz zugunsten der jungen Gemeinde und ist es, der dem misstrauisch beäugten Ex-Verfolger Paulus als Erster vertraut und ihn den Aposteln vorstellt. Gemeinsam brechen sie später zu ausgedehnten Missionsreisen auf.",
lesson:"Barnabas zeigt, wie wichtig Menschen sind, die anderen eine zweite Chance geben und sie fördern, statt sie abzuschreiben.",
verseRef:"Apostelgeschichte 4; 9; 13"},

{id:"priszilla-aquila",name:"Priszilla & Aquila",testament:"NT",category:"Weggefährten",era:"Frühe Kirche",
teaser:"Ehepaar, das Paulus unterstützte und Apollos unterwies",
story:"Das Ehepaar Priszilla und Aquila, wie Paulus im Zelthandwerk tätig, nimmt ihn in Korinth gastfreundlich auf und begleitet ihn auf Teilen seiner Reisen. Gemeinsam erklären sie dem beredten Prediger Apollos den Weg Gottes noch genauer.",
lesson:"Priszilla und Aquila zeigen, wie wertvoll ein Ehepaar sein kann, das Glauben, Gastfreundschaft und Lehre gemeinsam lebt.",
verseRef:"Apostelgeschichte 18; Römer 16"},

{id:"kornelius",name:"Kornelius",testament:"NT",category:"Weggefährten",era:"Frühe Kirche",
teaser:"Römischer Hauptmann, erster nichtjüdischer Christ",
story:"Der römische Hauptmann Kornelius ist trotz seiner heidnischen Herkunft für seine Frömmigkeit und Wohltätigkeit bekannt. Nach einer Vision sendet er nach Petrus, der daraufhin selbst in einer Vision erkennt, dass Gottes Botschaft auch Nichtjuden gilt, und tauft Kornelius und seine ganze Hausgemeinschaft.",
lesson:"Kornelius' Geschichte markiert einen Wendepunkt: Gottes Liebe kennt keine Volksgrenzen.",
verseRef:"Apostelgeschichte 10"},

{id:"josef-arimathaea",name:"Josef von Arimathäa",testament:"NT",category:"Weggefährten",era:"Leben Jesu",
teaser:"Wohlhabender Ratsherr, der Jesus sein eigenes Grab gab",
story:"Josef von Arimathäa, ein angesehenes und wohlhabendes Mitglied des jüdischen Hohen Rates, hatte Jesu Verurteilung nicht zugestimmt. Nach der Kreuzigung bittet er mutig Pilatus um den Leichnam Jesu und lässt ihn in seinem eigenen, neuen Felsengrab bestatten.",
lesson:"Josef zeigt, dass Glaube manchmal bedeutet, entgegen dem Konsens der eigenen Gruppe leise, aber entschlossen zu handeln.",
verseRef:"Matthäus 27; Johannes 19"}
];

{text:"Freut euch in dem Herrn allewege, und abermals sage ich: Freuet euch!",ref:"Philipper 4,4"},
{text:"Meine Gnade genügt dir, denn meine Kraft vollendet sich in der Schwachheit.",ref:"2. Korinther 12,9"},
{text:"Vertraue auf den Herrn von ganzem Herzen und verlass dich nicht auf deinen eigenen Verstand.",ref:"Sprüche 3,5"},
{text:"Kommt her zu mir, alle, die ihr mühselig und beladen seid, ich will euch erquicken.",ref:"Matthäus 11,28"},
{text:"Der Herr ist mein Licht und mein Heil, vor wem sollte ich mich fürchten?",ref:"Psalm 27,1"},
{text:"Alles hat seine Zeit, und jedes Vorhaben unter dem Himmel hat seine Stunde.",ref:"Prediger 3,1"}
];

const CATEGORIES = ["Alle","Anfänge","Erzväter","Führer","Frauen","Könige","Propheten","Priester","Weisheit","Wegbereiter","Zentrale Gestalt","Apostel","Weggefährten"];

/* ---------- STATE ---------- */
let userData = {bookmarks:[], notes:{}};
let currentTab = "home";
let currentCategory = "Alle";
let currentSearch = "";
let openCharId = null;
let dataLoaded = false;

/* ---------- STORAGE ---------- */
async function loadUserData(){
  try{
    const raw = localStorage.getItem('bibel-app-data');
    if(raw){
      userData = JSON.parse(raw);
      if(!userData.bookmarks) userData.bookmarks = [];
      if(!userData.notes) userData.notes = {};
    }
  }catch(e){
    userData = {bookmarks:[], notes:{}};
  }
  dataLoaded = true;
}
async function saveUserData(){
  try{
    localStorage.setItem('bibel-app-data', JSON.stringify(userData));
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);
  }
}

/* ---------- HELPERS ---------- */
function getChar(id){ return CHARACTERS.find(c=>c.id===id); }
function isBookmarked(id){ return userData.bookmarks.includes(id); }
function toggleBookmark(id){
  if(isBookmarked(id)){
    userData.bookmarks = userData.bookmarks.filter(x=>x!==id);
  } else {
    userData.bookmarks.push(id);
  }
  saveUserData();
}
function dayOfYear(){
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const diff = now - start;
  return Math.floor(diff / 86400000);
}

function initial(name){
  return name.replace(/[^A-Za-zÀ-ÿ]/,'').charAt(0).toUpperCase();
}

/* ---------- RENDER: VERSE ---------- */
function renderVerse(){
  const v = VERSES[dayOfYear() % VERSES.length];
  document.getElementById('verse-text').textContent = '„' + v.text + '“';
  document.getElementById('verse-ref').textContent = v.ref;
}

/* ---------- RENDER: HOME ---------- */
function renderHome(){
  const featuredIds = ["david","ruth","paulus","esther"];
  const wrap = document.getElementById('featured-scroll');
  wrap.innerHTML = '';
  featuredIds.forEach(id=>{
    const c = getChar(id);
    if(!c) return;
    const el = document.createElement('div');
    el.className = 'featured-card';
    el.innerHTML = `
      <div class="char-initial">${initial(c.name)}</div>
      <p class="char-name">${c.name}</p>
      <p class="char-meta">${c.testament} &middot; ${c.category}</p>
    `;
    el.addEventListener('click', ()=>openDetail(c.id));
    wrap.appendChild(el);
  });

  const catWrap = document.getElementById('home-categories');
  catWrap.innerHTML = '';
  CATEGORIES.filter(c=>c!=="Alle").forEach(cat=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = cat;
    chip.addEventListener('click', ()=>{
      currentCategory = cat;
      currentSearch = '';
      switchTab('list');
    });
    catWrap.appendChild(chip);
  });
}

/* ---------- RENDER: LIST ---------- */
function renderChips(){
  const wrap = document.getElementById('list-chips');
  wrap.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (cat===currentCategory ? ' active' : '');
    chip.textContent = cat;
    chip.addEventListener('click', ()=>{
      currentCategory = cat;
      renderChips();
      renderList();
    });
    wrap.appendChild(chip);
  });
}

function filteredCharacters(){
  const q = currentSearch.trim().toLowerCase();
  return CHARACTERS.filter(c=>{
    const matchCat = currentCategory==="Alle" || c.category===currentCategory;
    if(!matchCat) return false;
    if(!q) return true;
    return c.name.toLowerCase().includes(q) ||
           c.teaser.toLowerCase().includes(q) ||
           c.story.toLowerCase().includes(q) ||
           c.category.toLowerCase().includes(q) ||
           c.era.toLowerCase().includes(q);
  });
}

function renderList(){
  const wrap = document.getElementById('char-list');
  const list = filteredCharacters();
  if(list.length===0){
    wrap.innerHTML = '<p class="empty-note">Keine Charaktere gefunden.<br>Versuche einen anderen Suchbegriff.</p>';
    return;
  }
  wrap.innerHTML = '';
  list.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'char-card';
    el.innerHTML = `
      <div class="char-initial">${initial(c.name)}</div>
      <div class="char-info">
        <p class="char-name">${c.name}</p>
        <p class="char-meta">${c.testament} &middot; ${c.category}</p>
        <p class="char-teaser">${c.teaser}</p>
      </div>
      <svg class="bm-star ${isBookmarked(c.id)?'on':''}" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>
    `;
    el.addEventListener('click', ()=>openDetail(c.id));
    wrap.appendChild(el);
  });
}

/* ---------- RENDER: MERKLISTE ---------- */
function renderMerkliste(){
  const wrap = document.getElementById('merkliste-content');
  const ids = userData.bookmarks;
  if(ids.length===0){
    wrap.innerHTML = '<p class="empty-note">Du hast noch keine Charaktere gemerkt.<br>Tippe beim Lesen einer Geschichte auf „Merken“, um sie hier zu sammeln.</p>';
    return;
  }
  wrap.innerHTML = '';
  ids.forEach(id=>{
    const c = getChar(id);
    if(!c) return;
    const note = userData.notes[id];
    const el = document.createElement('div');
    el.className = 'merk-card';
    el.innerHTML = `
      <div class="merk-top">
        <div class="char-initial">${initial(c.name)}</div>
        <div class="char-info">
          <p class="char-name">${c.name}</p>
          <p class="char-meta">${c.testament} &middot; ${c.category}</p>
        </div>
      </div>
      ${note ? `<p class="merk-note-preview">${note}</p>` : ''}
    `;
    el.addEventListener('click', ()=>openDetail(c.id));
    wrap.appendChild(el);
  });
}

/* ---------- DETAIL VIEW ---------- */
function openDetail(id){
  openCharId = id;
  const c = getChar(id);
  const body = document.getElementById('detail-body');
  const note = userData.notes[id] || '';
  body.innerHTML = `
    <div class="illum-frame"><span class="illum-letter">${initial(c.name)}</span></div>
    <h1 class="detail-name">${c.name}</h1>
    <div class="detail-badges">
      <span class="badge testament">${c.testament==="AT" ? "Altes Testament" : "Neues Testament"}</span>
      <span class="badge">${c.category}</span>
      <span class="badge">${c.era}</span>
    </div>

    <h3 class="detail-h3">Die Geschichte</h3>
    <p class="story-text">${c.story}</p>

    <h3 class="detail-h3">Was uns das sagt</h3>
    <div class="lesson-box">${c.lesson}</div>

    <h3 class="detail-h3">Bibelstelle</h3>
    <p class="verse-line">${c.verseRef}</p>

    <h3 class="detail-h3">Meine Notizen</h3>
    <textarea class="notes-area" id="note-textarea" placeholder="Was denkst du über diese Geschichte? Halte hier deine Gedanken fest&hellip;">${note}</textarea>
    <div class="save-row">
      <button class="save-btn" id="save-note-btn">Speichern</button>
      <span class="save-hint" id="save-hint"></span>
    </div>
  `;
  updateBookmarkButton();
  document.getElementById('save-note-btn').addEventListener('click', saveNote);
  document.getElementById('detail-view').classList.add('open');
  document.getElementById('detail-view').scrollTop = 0;
}

function closeDetail(){
  document.getElementById('detail-view').classList.remove('open');
  openCharId = null;
  renderList();
  renderMerkliste();
}

function saveNote(){
  const text = document.getElementById('note-textarea').value.trim();
  if(text){
    userData.notes[openCharId] = text;
  } else {
    delete userData.notes[openCharId];
  }
  saveUserData();
  const hint = document.getElementById('save-hint');
  hint.textContent = 'Gespeichert';
  setTimeout(()=>{ if(hint) hint.textContent=''; }, 1800);
}

function updateBookmarkButton(){
  const btn = document.getElementById('detail-bookmark-btn');
  const label = document.getElementById('bookmark-label');
  if(isBookmarked(openCharId)){
    btn.classList.add('active');
    label.textContent = 'Gemerkt';
  } else {
    btn.classList.remove('active');
    label.textContent = 'Merken';
  }
}

document.getElementById('detail-bookmark-btn').addEventListener('click', ()=>{
  toggleBookmark(openCharId);
  updateBookmarkButton();
});
document.getElementById('detail-back').addEventListener('click', closeDetail);

/* ---------- TABS ---------- */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
  if(tab==='list'){ renderChips(); renderList(); }
  if(tab==='merkliste'){ renderMerkliste(); }
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>switchTab(btn.dataset.tab));
});
document.getElementById('home-see-all').addEventListener('click', ()=>{
  currentCategory='Alle'; currentSearch=''; switchTab('list');
});
document.getElementById('header-search-btn').addEventListener('click', ()=>{
  switchTab('list');
  setTimeout(()=>document.getElementById('search-input').focus(), 200);
});
document.getElementById('search-input').addEventListener('input', (e)=>{
  currentSearch = e.target.value;
  renderList();
});

/* ---------- INIT ---------- */
async function init(){
  renderVerse();
  renderHome();
  await loadUserData();
  renderList();
  renderMerkliste();
}
init();
</script>
</body>
</html>
